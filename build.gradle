plugins {
    id 'base'
}

// Gathers the loader jars into build/libs so a release is one folder, not two.
// Sources jars stay in the subprojects.
tasks.register('collectJars', Copy) {
    description = 'Copies the Fabric and NeoForge jars into the root build/libs'
    group = 'build'

    from(project(':fabric').tasks.named('remapJar'))
    from(project(':neoforge').tasks.named('jar'))
    into layout.buildDirectory.dir('libs')
}

tasks.named('build') {
    dependsOn 'collectJars'
}
