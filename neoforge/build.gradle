plugins {
    id 'java-library'
    id 'maven-publish'
    // 1.20.1 predates the net.neoforged.neoforge package move, so it builds through
    // the legacy (SRG-at-runtime) toolchain rather than the modern moddev plugin.
    id 'net.neoforged.moddev.legacyforge' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'TerraformersMC (EMI)'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

base {
    // Loader in the name so both jars can sit in one folder
    archivesName = "${mod_id}-neoforge"
}

// 1.20.1 ships on Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    enable {
        // net.neoforged:forge -- NeoForge's 1.20.1 line, still on the
        // net.minecraftforge API, so this jar also loads on MinecraftForge.
        neoForgeVersion = project.neo_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // JEI (optional integration: the @JeiPlugin class only loads when JEI is present)
    compileOnly "mezz.jei:jei-1.20.1-common-api:15.21.0.148"
    compileOnly "mezz.jei:jei-1.20.1-forge-api:15.21.0.148"
    // EMI (optional integration: the @EmiEntrypoint class only loads when EMI is present)
    compileOnly "dev.emi:emi-forge:1.1.24+1.20.1:api"
}

// Expands the declared properties into META-INF/mods.toml.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
