# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Environment Properties
minecraft_version=1.20.1

## Fabric
# https://fabricmc.net/develop/
loader_version=0.16.14
# https://modrinth.com/mod/fabric-api/versions
fabric_api_version=0.92.11+1.20.1

## NeoForge
# 1.20.1 NeoForge is published as net.neoforged:forge and still exposes the
# net.minecraftforge API, so this jar also runs on MinecraftForge 1.20.1.
neo_version=1.20.1-47.1.106
minecraft_version_range=[1.20.1,1.21)
loader_version_range=[47,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale.
mod_id=forgottenman
# The human-readable display name for the mod.
mod_name=Forgotten Man
# The license of the mod.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.0.2
# The group ID for the mod. Should match the base package used for the mod sources.
mod_group_id=com.forgottenman
